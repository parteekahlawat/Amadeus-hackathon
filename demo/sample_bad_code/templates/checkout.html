<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Travel Booking - Checkout</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { color: #2c3e50; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
        /* BAD: button has no aria-label, low contrast colors */
        .btn-confirm { background: #ccc; color: #999; padding: 15px 30px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        .price-display { font-size: 24px; font-weight: bold; color: #27ae60; }
        /* BAD: error text has no role="alert" */
        .error-text { color: red; display: none; }
        /* Image without alt text */
    </style>
</head>
<body>
    <div class="container">
        <h1>Complete Your Booking</h1>

        <!-- BAD: image without alt text -->
        <img src="/static/hero.jpg" width="600">

        <div class="price-display" id="price-total">$0.00</div>

        <form id="checkout-form" method="POST" action="/checkout">
            <!-- NO CSRF TOKEN - security vulnerability -->

            <div class="form-group">
                <label for="destination">Destination</label>
                <input type="text" id="destination" name="destination" placeholder="Where to?">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <!-- BAD: no autocomplete attribute, no aria-describedby for validation -->
                <input type="text" id="email" name="email" placeholder="Enter email">
            </div>

            <div class="form-group">
                <label for="passengers">Passengers</label>
                <select id="passengers" name="passengers">
                    <option value="">Select</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                </select>
            </div>

            <div class="form-group">
                <label>Payment</label>
                <!-- BAD: no fieldset/legend for radio group, no keyboard focus indicator -->
                <input type="radio" name="payment" value="card"> Credit Card
                <input type="radio" name="payment" value="paypal"> PayPal
            </div>

            <div class="error-text">Something went wrong</div>

            <!-- BAD: class renamed from btn-book to btn-confirm (breaks old tests) -->
            <!-- BAD: no aria-label, insufficient contrast -->
            <button type="submit" class="btn-confirm">Book Now</button>
        </form>

        <!-- BAD: no skip-to-content link, no landmark roles -->
    </div>

    <script>
        // BAD: inline script, no nonce for CSP
        document.getElementById('checkout-form').addEventListener('submit', function(e) {
            e.preventDefault();
            // Would submit to /checkout
        });
    </script>
</body>
</html>
